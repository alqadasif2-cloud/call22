name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: اختبارات الوحدة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Unit tests
        run: gradle --no-daemon :core:testDebugUnitTest :backup-app:testDebugUnitTest :viewer-app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  rules:
    name: اختبار قواعد Firebase على المحاكي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm install --prefix firebase/rules-test
      - name: Run rules tests
        working-directory: firebase
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-backup "npm --prefix rules-test test"

  build:
    name: بناء ملفي APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Restore google-services.json from secret
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS" ]; then echo "::error::أضف السر GOOGLE_SERVICES_JSON_BASE64 (راجع SETUP_AR.md)"; exit 1; fi
          echo "$GS" | base64 -d > backup-app/google-services.json
          echo "$GS" | base64 -d > viewer-app/google-services.json
      - name: Assemble APKs
        run: gradle --no-daemon :backup-app:assembleDebug :viewer-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: backup-app-apk
          path: backup-app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-app-apk
          path: viewer-app/build/outputs/apk/debug/*.apk
