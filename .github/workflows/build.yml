name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: اختبارات الوحدة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Unit tests
        run: gradle --no-daemon :core:testDebugUnitTest :backup-app:testDebugUnitTest :viewer-app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  rules:
    name: اختبار قواعد Firebase على المحاكي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm install --prefix firebase/rules-test
      - name: Run rules tests
        working-directory: firebase
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-backup "npm --prefix rules-test test"

  build:
    name: بناء ملفي APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Restore google-services.json from secret
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GS_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, sys

          raw = (os.environ.get("GS_B64") or os.environ.get("GS_RAW") or "").strip()
          if not raw:
              print("::error::أضف السر GOOGLE_SERVICES_JSON_BASE64 في إعدادات مستودع GitHub (Settings -> Secrets and variables -> Actions -> New repository secret). يمكنك لصق محتوى google-services.json النصي مباشرة أو بصيغة Base64.", file=sys.stderr)
              sys.exit(1)

          if raw.startswith("{"):
              content = raw.encode("utf-8")
          else:
              cleaned = "".join(raw.split())
              try:
                  content = base64.b64decode(cleaned)
              except Exception as exc:
                  print(f"::error::تعذر فك ترميز GOOGLE_SERVICES_JSON_BASE64 ({exc}). الصق محتوى ملف google-services.json مباشرة أو بصيغة Base64 صحيحة.", file=sys.stderr)
                  sys.exit(1)

          try:
              parsed = json.loads(content.decode("utf-8-sig"))
          except Exception as exc:
              print(f"::error::محتوى السر ليس ملف google-services.json صالحًا ({exc}).", file=sys.stderr)
              sys.exit(1)

          pkgs = {
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in parsed.get("client", [])
          }
          missing = {"app.backup.source", "app.backup.viewer"} - pkgs
          if missing:
              print(f"::error::ملف google-services.json لا يحتوي على الحزم المطلوبة: {', '.join(sorted(missing))}. سجّل التطبيقين في إعدادات مشروع Firebase ثم أعد تنزيل الملف.", file=sys.stderr)
              sys.exit(1)

          for target in ("backup-app/google-services.json", "viewer-app/google-services.json"):
              pathlib.Path(target).write_bytes(content)
          print("تمت استعادة والتحقق من google-services.json بنجاح للحزمتين app.backup.source و app.backup.viewer.")
          PY
      - name: Assemble APKs
        run: gradle --no-daemon :backup-app:assembleDebug :viewer-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: backup-app-apk
          path: backup-app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-app-apk
          path: viewer-app/build/outputs/apk/debug/*.apk
